<style>
/* ---- theme ---- */
:root{
  --radius:.9rem;
  --background:#0d0d0d;          /* oklch(16% 0 0) */
  --foreground:#eeeeee;          /* oklch(95% 0 0) */
  --card:#161616;                /* oklch(20% 0 0) */
  --primary:#c4c4c4;             /* oklch(82% 0 0) */
  --primary-foreground:#0b0b0b;  /* oklch(15% 0 0) */
  --muted-foreground:#a4a4a4;    /* oklch(72% 0 0) */
  --border:rgba(58,58,58,.45);   /* oklch(35% 0 0/.45) */
  --card-70:rgba(22,22,22,.7);
  --card-90:rgba(22,22,22,.9);
  --muted-70:rgba(164,164,164,.7);
  --p15:rgba(196,196,196,.15);
  --p20:rgba(196,196,196,.2);
  --p40:rgba(196,196,196,.4);
  --p45:rgba(196,196,196,.45);
  --p60:rgba(196,196,196,.6);
  --p70:rgba(196,196,196,.7);
  --gradient-hero:radial-gradient(ellipse at 50% 0%,rgba(46,46,46,.55) 0%,transparent 60%),linear-gradient(180deg,#0d0d0d 0%,#060606 100%);
  --font:"Arial",system-ui,sans-serif;
}
@supports (color:color-mix(in lab,red,red)){
  :root{
    --background:oklch(16% 0 0);--foreground:oklch(95% 0 0);--card:oklch(20% 0 0);--primary:oklch(82% 0 0);
    --primary-foreground:oklch(15% 0 0);--muted-foreground:oklch(72% 0 0);--border:oklch(35% 0 0/.45);
    --card-70:color-mix(in oklab,var(--card) 70%,transparent);
    --card-90:color-mix(in oklab,var(--card) 90%,transparent);
    --muted-70:color-mix(in oklab,var(--muted-foreground) 70%,transparent);
    --p15:color-mix(in oklab,var(--primary) 15%,transparent);
    --p20:color-mix(in oklab,var(--primary) 20%,transparent);
    --p40:color-mix(in oklab,var(--primary) 40%,transparent);
    --p45:color-mix(in oklab,var(--primary) 45%,transparent);
    --p60:color-mix(in oklab,var(--primary) 60%,transparent);
    --p70:color-mix(in oklab,var(--primary) 70%,transparent);
    --gradient-hero:radial-gradient(ellipse at 50% 0%,oklch(30% 0 0/.55) 0%,transparent 60%),linear-gradient(180deg,oklch(16% 0 0) 0%,oklch(12% 0 0) 100%);
  }
}

/* ---- base ---- */
*,::before,::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:var(--font)}
body{background:var(--gradient-hero);background-attachment:fixed;color:var(--foreground);font-family:var(--font)}
a{color:inherit;text-decoration:inherit}
svg{display:block;vertical-align:middle}
h1{font-size:inherit;font-weight:inherit;font-family:var(--font);letter-spacing:0}

/* ---- their custom animations, verbatim ---- */
.rise-in{animation:rise-in .7s ease-out both}
@keyframes rise-in{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.live-dot{animation:live-blink 1.4s ease-in-out infinite}
@keyframes live-blink{0%,100%{opacity:1}50%{opacity:.25}}
.logo-halo{animation:halo-spin 14s linear infinite}
@keyframes halo-spin{to{transform:rotate(360deg)}}
.logo-glow{animation:logo-pulse 3s ease-in-out infinite}
@keyframes logo-pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 2px rgba(196,196,196,.6),0 0 25px 4px rgba(196,196,196,.35)}50%{transform:scale(1.025);box-shadow:0 0 0 3px rgba(196,196,196,.9),0 0 70px 14px rgba(196,196,196,.65)}}
.crown-badge{filter:drop-shadow(0 0 12px rgba(196,196,196,.55));animation:crown-float 3.4s ease-in-out infinite}
@keyframes crown-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.05)}}
.text-glow{text-shadow:0 0 24px rgba(196,196,196,.45)}

/* ---- stars (40 random twinkling dots, generated on load like the original) ---- */
.star{position:absolute;border-radius:9999px;background-color:rgba(196,196,196,.5)}
@supports (color:color-mix(in lab,red,red)){.star{background-color:color-mix(in oklab,var(--primary) 50%,transparent)}}

/* ---- tap effect: pop bubble + sparks + press flash (verbatim keyframes) ---- */
.pop{pointer-events:none;position:absolute;inset-inline:0;bottom:100%;z-index:10;height:7rem}
.pop-bubble{position:absolute;bottom:.25rem;left:50%;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;border-radius:9999px;border:1px solid var(--p45);
  background-color:var(--card-90);padding:.375rem 1rem;font-size:.75rem;line-height:1.3333;font-weight:600;letter-spacing:.025em;color:var(--primary);text-transform:uppercase;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pop-bubble .85s ease-out both}
.pop-bubble i{display:block;width:.375rem;height:.375rem;border-radius:9999px;background-color:var(--primary)}
@keyframes pop-bubble{0%{opacity:0;transform:translate(-50%,16px) scale(.75)}22%{opacity:1;transform:translate(-50%,-2px) scale(1)}64%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-42px) scale(.94)}}
.pop-spark{position:absolute;bottom:.5rem;left:50%;border-radius:9999px;background-color:var(--primary);box-shadow:0 0 30px rgba(196,196,196,.45);animation:pop-spark .8s ease-out both}
@keyframes pop-spark{0%{opacity:0;transform:translate3d(calc(-50% + var(--pop-x,0px)),12px,0) scale(.3)}14%{opacity:1}100%{opacity:0;transform:translate3d(calc(-50% + var(--pop-x,0px)),-68px,0) scale(1)}}

/* ---- layout ---- */
main{position:relative;min-height:100vh;overflow:hidden;padding:3.5rem 1.25rem}
.bg{pointer-events:none;position:absolute;inset:0}
.wrap{position:relative;margin:0 auto;display:flex;max-width:36rem;flex-direction:column;align-items:center;text-align:center}

.pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;border:1px solid var(--border);background-color:var(--card-70);padding:.375rem 1rem;
  font-size:.75rem;line-height:1.3333;font-weight:600;letter-spacing:.25em;color:var(--primary);text-transform:uppercase;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dot{width:.5rem;height:.5rem;border-radius:9999px;background-color:var(--primary)}

.logo-zone{position:relative;margin-top:2.5rem;width:11rem;height:11rem}
.halo{position:absolute;inset:-1rem;border-radius:9999px;border:1px dashed var(--p40)}
.logo{position:relative;width:100%;height:100%;border-radius:9999px;background-color:var(--card);background-image:url('https://pub-2bd0f7d6f1c24613a7d0b319b559a9cc.r2.dev/profiles/ree-ee8426b6.webp');background-size:cover;background-position:center;}
.crown{position:absolute;right:-.75rem;bottom:-.75rem;z-index:20;display:grid;place-items:center;width:3rem;height:3rem;border-radius:9999px;
  border:1px solid var(--p45);background-color:var(--background);padding:.5rem}
.crown svg{width:100%;height:100%;color:var(--primary);transform:translateY(-.25rem)}

h1{margin-top:3rem;display:flex;width:100%;align-items:baseline;justify-content:center;white-space:nowrap;font-size:1rem;line-height:1.25;font-weight:900;text-transform:uppercase}
.sub{margin-top:.75rem;font-size:1.125rem;line-height:1.5556;color:var(--muted-foreground)}
.rule{margin-top:2rem;height:1px;width:10rem;background-image:linear-gradient(to right,transparent,var(--p70),transparent)}

.cta-wrap{position:relative;margin-top:4rem;width:100%}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;cursor:pointer;width:100%;height:auto;
  border-radius:var(--radius);border:1px solid var(--p60);background-color:var(--p15);padding:1.25rem 2rem;
  font-size:1.25rem;line-height:1.4;font-weight:700;color:var(--primary);
  box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);
  transition:scale .1s cubic-bezier(.4,0,.2,1),transform .1s cubic-bezier(.4,0,.2,1)}
.cta:hover{background-color:var(--p20);scale:1.02}
.cta:active{scale:.96}
.cta-pressed{animation:rise-in .7s ease-out both,cta-press .45s ease-out}
@keyframes cta-press{0%{background-color:rgba(196,196,196,.45);transform:scale(.94);box-shadow:0 0 rgba(196,196,196,.7)}60%{box-shadow:0 0 0 18px rgba(196,196,196,0)}100%{background-color:rgba(196,196,196,.15);transform:scale(1);box-shadow:0 0 45px rgba(196,196,196,.7)}}
.cta-in{display:flex;align-items:center;justify-content:center;gap:.75rem}
.free{border-radius:9999px;background-color:var(--primary);padding:.125rem .625rem;font-size:.7rem;line-height:1.5;font-weight:900;text-transform:uppercase;letter-spacing:.025em;color:var(--primary-foreground)}

.note{margin-top:1.5rem;max-width:24rem;font-size:.875rem;line-height:1.625;color:var(--muted-foreground)}
.foot{margin-top:3rem;font-size:.75rem;line-height:1.3333;color:var(--muted-70)}

@media (min-width:40rem){
  .logo-zone{width:13rem;height:13rem}
  .crown{width:3.5rem;height:3.5rem;padding:.625rem}
  h1{font-size:1.5rem;line-height:1.25}
}


@media (prefers-reduced-motion:reduce){*,::before,::after{transition:none!important;animation:none!important}}
